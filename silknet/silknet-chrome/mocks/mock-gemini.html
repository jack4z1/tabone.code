<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock Gemini — Silknet Conformance</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #131314;
        --panel: #1e1f20;
        --line: #3c4043;
        --text: #e3e3e3;
        --muted: #9aa0a6;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      header {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        font-size: 12px;
      }
      .badge {
        padding: 2px 8px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        color: var(--accent);
        font-weight: 600;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 18px 14px 6px;
      }
      #empty-state { color: var(--muted); font-size: 13px; }
      user-query, model-response {
        display: block;
        max-width: 760px;
        margin: 0 auto 16px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #18191a;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      user-query { background: #282a2c; }
      .turn-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 4px;
        display: block;
      }
      footer {
        padding: 12px 14px;
        background: var(--panel);
        border-top: 1px solid var(--line);
      }
      .composer-wrap {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      rich-textarea {
        flex: 1;
        display: block;
      }
      .ql-editor {
        width: 100%;
        min-height: 48px;
        max-height: 160px;
        overflow-y: auto;
        padding: 8px 10px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        font: inherit;
        outline: none;
      }
      .ql-editor:focus { border-color: var(--accent); }
      button {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .send-button { background: var(--accent); color: #000; }
      .send-button:disabled { opacity: 0.4; cursor: not-allowed; }
      .stop-button { background: #ea4335; color: #fff; }
      [hidden] { display: none !important; }
      .reply-actions { margin-top: 8px; }
      .reply-actions button {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        padding: 3px 8px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="badge">Gemini Mock</span>
      <span>Simulated gemini.google.com environment for Silknet conformance</span>
    </header>
    <main id="chat-window">
      <div id="conversation">
        <div id="empty-state">Ready for debate prompt.</div>
      </div>
    </main>
    <footer>
      <div class="composer-wrap">
        <rich-textarea>
          <div
            id="prompt-editor"
            class="ql-editor"
            contenteditable="true"
            role="textbox"
            aria-label="Enter a prompt here"
          ></div>
        </rich-textarea>
        <button id="send-button" class="send-button" aria-label="Send message" disabled>Send</button>
        <button id="stop-button" class="stop-button" aria-label="Stop response" hidden>Stop</button>
      </div>
    </footer>
    <script src="mock-gemini.js"></script>
  </body>
</html>
