<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock Claude — Silknet v0.2</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1f1e1d;
        --panel: #2b2a27;
        --line: #3d3b37;
        --text: #f5f4ef;
        --muted: #a39e93;
        --accent: #d97706;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        font-size: 12px;
      }
      .badge {
        padding: 2px 8px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        color: var(--accent);
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .note { color: var(--muted); }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 18px 14px 6px;
      }
      #empty-state { color: var(--muted); font-size: 13px; }
      .message-turn {
        max-width: 760px;
        margin: 0 auto 16px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #252422;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .font-user-message { background: #332f28; }
      .turn-label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .grid-cols-1 { display: block; }
      .reply-actions { margin-top: 8px; display: flex; gap: 6px; }
      .reply-actions button {
        font: inherit;
        font-size: 12px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 8px;
        cursor: pointer;
      }
      fieldset {
        position: sticky;
        bottom: 0;
        margin: 0;
        display: flex;
        gap: 8px;
        align-items: flex-end;
        padding: 12px 14px 16px;
        border: 0;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      .ProseMirror {
        flex: 1;
        min-height: 44px;
        max-height: 160px;
        overflow-y: auto;
        padding: 10px 12px;
        font: inherit;
        color: var(--text);
        background: #181716;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .ProseMirror:focus { outline: 1px solid var(--accent); }
      .ProseMirror[contenteditable="false"] { opacity: 0.55; }
      #composer-actions { display: flex; gap: 6px; }
      #send-button,
      #stop-button {
        font: inherit;
        font-weight: 600;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--accent);
        color: #10131a;
        cursor: pointer;
      }
      #stop-button { background: #e8eaee; }
      #send-button:disabled { opacity: 0.45; cursor: default; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body data-mock-provider="claude" data-silknet-mock="v0.2">
    <header>
      <span class="badge">MOCK</span>
      <span class="note">Simulated Claude UI — offline adapter iteration, no real provider traffic.</span>
    </header>

    <main id="conversation" role="log" aria-live="polite" data-testid="chat-messages">
      <p id="empty-state">New chat. Nothing submitted yet.</p>
    </main>

    <fieldset id="composer-container">
      <div
        id="prompt-editor"
        class="ProseMirror"
        role="textbox"
        contenteditable="true"
        aria-label="Write your prompt to Claude"
        data-testid="chat-input"
      ><p><br></p></div>
      <div id="composer-actions">
        <button id="stop-button" type="button" aria-label="Stop Response" data-testid="stop-button" hidden>
          Stop
        </button>
        <button id="send-button" type="button" aria-label="Send Message" data-testid="send-button" disabled>
          Send
        </button>
      </div>
    </fieldset>

    <script src="mock-claude.js"></script>
  </body>
</html>
