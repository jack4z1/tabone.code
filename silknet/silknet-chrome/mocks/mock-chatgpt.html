<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock ChatGPT — Silknet v0.1</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16181d;
        --panel: #1f2228;
        --line: #313640;
        --text: #e8eaee;
        --muted: #9aa2b1;
        --accent: #7aa2f7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        font-size: 12px;
      }
      .badge {
        padding: 2px 8px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        color: var(--accent);
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .note { color: var(--muted); }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 18px 14px 6px;
      }
      #empty-state { color: var(--muted); font-size: 13px; }
      article {
        max-width: 760px;
        margin: 0 auto 16px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #1a1d23;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      article[data-message-author-role="user"] { background: #202733; }
      .turn-label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .markdown { display: block; }
      .reply-actions { margin-top: 8px; display: flex; gap: 6px; }
      .reply-actions button {
        font: inherit;
        font-size: 12px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 8px;
        cursor: pointer;
      }
      form {
        position: sticky;
        bottom: 0;
        display: flex;
        gap: 8px;
        align-items: flex-end;
        padding: 12px 14px 16px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      textarea {
        flex: 1;
        min-height: 44px;
        max-height: 160px;
        resize: vertical;
        padding: 10px 12px;
        font: inherit;
        color: var(--text);
        background: #14161b;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      textarea:focus { outline: 1px solid var(--accent); }
      textarea:disabled { opacity: 0.55; }
      #composer-actions { display: flex; gap: 6px; }
      #send-button,
      #stop-button {
        font: inherit;
        font-weight: 600;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--accent);
        color: #10131a;
        cursor: pointer;
      }
      #stop-button { background: #e8eaee; }
      #send-button:disabled { opacity: 0.45; cursor: default; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body data-mock-provider="chatgpt" data-silknet-mock="v0.1">
    <header>
      <span class="badge">MOCK</span>
      <span class="note">Simulated ChatGPT UI — offline adapter iteration, no real provider traffic.</span>
    </header>

    <main id="conversation" role="log" aria-live="polite">
      <p id="empty-state">New chat. Nothing submitted yet.</p>
    </main>

    <form id="composer-form" autocomplete="off">
      <textarea
        id="prompt-textarea"
        name="prompt"
        role="textbox"
        aria-label="Message ChatGPT"
        placeholder="Message ChatGPT"
        rows="1"
      ></textarea>
      <div id="composer-actions">
        <button id="stop-button" type="button" aria-label="Stop generating" data-testid="stop-button" hidden>
          Stop
        </button>
        <button id="send-button" type="submit" aria-label="Send message" data-testid="send-button" disabled>
          Send
        </button>
      </div>
    </form>

    <script src="mock-chatgpt.js"></script>
  </body>
</html>
